name: Bug report
description: Report a reproducible problem in the code or software workflow.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload patient-identifiable data, DICOM files, reports, or model weights.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact commands or GUI actions.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU/CUDA, package versions.
      placeholder: |
        Windows 11
        Python 3.10
        CUDA ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste non-sensitive logs only.
      render: text
    validations:
      required: false
