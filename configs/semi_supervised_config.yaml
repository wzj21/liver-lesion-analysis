# 半监督学习配置文件
# Semi-Supervised Learning Configuration

# ==================== 全局设置 ====================
global:
  seed: 42
  device: "cuda"
  num_workers: 8
  pin_memory: true
  mixed_precision: true  # AMP混合精度训练

# ==================== 数据配置 ====================
data:
  # 数据比例设置
  labeled_ratio: 0.2  # 全标注数据比例
  weak_labeled_ratio: 0.3  # 弱标注数据比例（仅图像级标签）
  unlabeled_ratio: 0.5  # 无标注数据比例
  
  # 数据路径
  labeled_data_path: "data/labeled/"
  weak_labeled_data_path: "data/weak_labeled/"
  unlabeled_data_path: "data/unlabeled/"
  
  # 批次大小
  labeled_batch_size: 4
  unlabeled_batch_size: 8  # 无标注数据批次通常更大
  
  # 数据增强
  augmentation:
    weak:  # 弱增强
      random_flip: true
      random_rotation: [-5, 5]
      random_scale: [0.95, 1.05]
    strong:  # 强增强
      random_flip: true
      random_rotation: [-15, 15]
      random_scale: [0.8, 1.2]
      elastic_deformation: true
      gaussian_noise: 0.02
      random_contrast: [0.7, 1.3]
      random_gamma: [0.7, 1.3]
      cutout: true
      cutout_ratio: 0.2

# ==================== Teacher-Student配置 ====================
teacher_student:
  # EMA更新参数
  ema_decay: 0.999
  ema_warmup_epochs: 5
  ema_decay_schedule: "cosine"  # constant, linear, cosine
  
  # 伪标签配置
  pseudo_label:
    confidence_threshold: 0.7  # 置信度阈值
    uncertainty_threshold: 0.3  # 不确定性阈值（低于此值才使用）
    use_soft_labels: false  # 是否使用软标签
    update_frequency: 1  # 每N个epoch更新伪标签
    
  # 一致性正则化
  consistency:
    weight: 1.0
    ramp_up_epochs: 20  # 预热轮数
    ramp_up_type: "sigmoid"  # linear, sigmoid, cosine

# ==================== Stage1分割半监督配置 ====================
stage1_segmentation:
  method: "cross_pseudo_supervision"  # cross_pseudo_supervision, mean_teacher
  
  cross_pseudo_supervision:
    # 双网络配置
    network_a:
      init_seed: 42
      dropout: 0.1
    network_b:
      init_seed: 123
      dropout: 0.15
    
    # CPS损失权重
    cps_weight: 1.0
    cps_ramp_up_epochs: 20
    
    # 伪标签处理
    pseudo_label_threshold: 0.8
    use_uncertainty_weighting: true
  
  mean_teacher:
    ema_decay: 0.999
    consistency_weight: 1.0

# ==================== Stage2检测分割半监督配置 ====================
stage2_detection_segmentation:
  method: "teacher_student"
  
  # 检测半监督
  detection:
    pseudo_label_threshold: 0.7
    nms_threshold: 0.5
    min_pseudo_boxes: 1
    max_pseudo_boxes: 20
    
  # 分割半监督
  segmentation:
    method: "box_supervised"  # box_supervised, teacher_student
    
    # BoxInst/DiscoBox弱监督分割
    box_supervised:
      pairwise_loss_weight: 1.0
      projection_loss_weight: 0.5
      
  # 一致性损失
  consistency:
    detection_weight: 0.5
    segmentation_weight: 1.0

# ==================== Stage3分类半监督配置 ====================
stage3_classification:
  method: "fixmatch"
  
  fixmatch:
    # 伪标签阈值
    confidence_threshold: 0.95
    
    # 不确定性过滤
    use_uncertainty_filter: true
    uncertainty_threshold: 0.2
    
    # 损失权重
    unsupervised_weight: 1.0
    
    # 分布对齐
    distribution_alignment: true
    da_temperature: 0.5

# ==================== 训练配置 ====================
training:
  # 训练阶段
  warmup_epochs: 10  # 仅使用有标签数据的预热轮数
  total_epochs: 200
  
  # 优化器
  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  
  # 学习率调度
  scheduler:
    type: "cosine"
    min_lr: 1e-6
    warmup_epochs: 10
  
  # 损失权重
  loss_weights:
    supervised: 1.0
    unsupervised: 1.0
    consistency: 0.5
    
  # 梯度裁剪
  gradient_clip: 1.0
  
  # 检查点
  checkpoint:
    save_frequency: 10
    save_best: true
    monitor_metric: "val_dice"

# ==================== 伪标签质量监控 ====================
pseudo_label_monitoring:
  # 伪标签质量评估
  evaluate_frequency: 10  # 每N个epoch评估一次
  
  # 质量指标
  metrics:
    - accuracy  # 与真实标签对比（如果有验证集）
    - confidence_distribution
    - uncertainty_distribution
    
  # 自适应阈值
  adaptive_threshold:
    enabled: true
    target_ratio: 0.5  # 目标使用比例
    min_threshold: 0.6
    max_threshold: 0.95
    adjustment_rate: 0.02

# ==================== 日志与可视化 ====================
logging:
  log_frequency: 100  # 每N个batch记录一次
  tensorboard: true
  wandb:
    enabled: false
    project: "liver_lesion_semi_supervised"
    
  # 可视化
  visualization:
    pseudo_label_samples: 10  # 可视化伪标签样本数
    confidence_histogram: true
    uncertainty_histogram: true
